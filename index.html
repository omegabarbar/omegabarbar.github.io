<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capsah Scoreboard ♢♧♡♤</title>

<style>
*{box-sizing:border-box;}
body{font-family:Arial, sans-serif;background:#0f1720;color:white;padding:15px;margin:0;}
h1{text-align:center;margin-top:45px;margin-bottom:10px;}
button{padding:10px 14px;border:none;border-radius:6px;margin:5px;cursor:pointer;font-weight:bold;}
.kick{background:orange;color:#111827;}
.reset{background:red;color:white;}
.board{display:flex;flex-direction:column;gap:20px;}
.tableBox{background:#1b2430;padding:12px;border-radius:10px;overflow-x:auto;}
input{background:#111827;color:white;border:1px solid #334155;border-radius:4px;padding:6px;text-align:center;}
.plus{color:#00e676;font-weight:bold;}
.minus{color:#ff5252;font-weight:bold;}
.footer{padding:20px 10px;text-align:center;color:#94a3b8;font-size:0.95rem;}

/* Header Set & Tombol Share WA */
.table-header-flex{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  flex-wrap:wrap;
  gap:8px;
}
.table-header-flex h3{margin:0;}
.btn-share{
  background:#25D366;
  color:white;
  padding:6px 12px;
  font-size:0.85rem;
  display:flex;
  align-items:center;
  gap:5px;
}
.btn-share:hover{background:#20ba5a;}

/* Styling Topbar & Info Jadwal */
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;background:#1b2430;padding:12px 15px;border-radius:10px;margin-bottom:20px;gap:10px;}
.mata-group{display:flex;align-items:center;gap:8px;}
.schedule-info-box{
  text-align:center;
  background:#1b2430;
  border:1px solid #334155;
  padding:10px 15px;
  border-radius:8px;
  max-width:600px;
  margin:0 auto 20px auto;
  font-size:0.95rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
.schedule-details{display:flex;flex-direction:column;gap:4px;text-align:left;}
.btn-edit-date{background:#334155;color:white;padding:6px 12px;font-size:0.8rem;margin:0;}

/* Styling Popup / Modal Sebelum Masuk */
.modal-overlay{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(15, 23, 32, 0.95);
  backdrop-filter:blur(5px);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:15px;
}
.modal-box{
  background:#1b2430;
  border:1px solid #334155;
  padding:25px;
  border-radius:12px;
  max-width:420px;
  width:100%;
  text-align:left;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
}
.modal-box h2{margin-top:0;color:#00e676;text-align:center;}
.modal-box p{color:#cbd5e1;font-size:0.95rem;margin-bottom:15px;}
.modal-box label{font-size:0.85rem;color:#94a3b8;display:block;margin-bottom:4px;}
.modal-box input{
  width:100%;
  padding:10px;
  font-size:0.95rem;
  margin-bottom:15px;
  color-scheme:dark;
  text-align:left;
}
.btn-submit-date{
  background:#00e676;
  color:#0f1720;
  width:100%;
  padding:12px;
  font-size:1rem;
  margin:0;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}
.btn-submit-date:hover{background:#00c853;}
</style>
</head>

<body>

<!-- POPUP / MODAL JADWAL MAIN & BAYAR -->
<div id="scheduleModal" class="modal-overlay">
  <div class="modal-box">
    <h2>Pengaturan Jadwal Main</h2>
    
    <label for="modalPlayInput">Jadwal Main (Tanggal & Jam):</label>
    <input type="datetime-local" id="modalPlayInput" required>

    <label for="modalPayInput">Jadwal Batas Bayar / Tagihan:</label>
    <input type="date" id="modalPayInput" required>

    <button class="btn-submit-date" onclick="simpanJadwal()">Mulai Permainan</button>
  </div>
</div>

<a href="main.html" style="position: absolute; top: 10px; right: 10px; text-decoration: none;">
  <button style="padding: 10px 15px; background: #53c8ef; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">← Back to Portfolio</button>
</a>

<h1>CAPSAH SCOREBOARD</h1>

<!-- TAMPILAN INFORMASI JADWAL DI BAWAH JUDUL -->
<div class="schedule-info-box" id="scheduleInfoBox" style="display:none;">
  <div class="schedule-details">
    <span>🎮 <strong>Jadwal Main:</strong> <span id="displayPlayDate" style="color:#00e676;">-</span></span>
    <span>💸 <strong>Jadwal Bayar:</strong> <span id="displayPayDate" style="color:#ff5252;">-</span></span>
  </div>
  <button class="btn-edit-date" onclick="bukaModalJadwal()">Ubah Jadwal</button>
</div>

<div class="topbar">
  <div class="mata-group">
    <label for="mata"><strong>MATA (Rp)</strong></label>
    <input id="mata" type="number" value="5000" oninput="updateSemuaHitung()">
  </div>
  <div class="action-buttons">
    <button class="kick" onclick="kick()">KICK</button>
    <button class="reset" onclick="resetGame()">RESET</button>
  </div>
</div>

<div id="tables" class="board"></div>

<script>
let players = 4;
let rounds = 25;

// --- FORMAT TANGGAL & JAM ---
function formatDateTimeIndo(dateTimeString) {
  if (!dateTimeString) return "-";
  const opsi = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
  const dateObj = new Date(dateTimeString);
  return dateObj.toLocaleDateString('id-ID', opsi) + " WIB";
}

function formatDateIndo(dateString) {
  if (!dateString) return "-";
  const opsi = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const dateObj = new Date(dateString + "T00:00:00");
  return dateObj.toLocaleDateString('id-ID', opsi);
}

function simpanJadwal() {
  const playVal = document.getElementById("modalPlayInput").value;
  const payVal = document.getElementById("modalPayInput").value;

  if (!playVal || !payVal) {
    alert("Mohon lengkapi Jadwal Main dan Jadwal Bayar terlebih dahulu!");
    return;
  }

  localStorage.setItem("capsah_play_time", playVal);
  localStorage.setItem("capsah_pay_date", payVal);

  tampilkanInfoJadwal(playVal, payVal);
  document.getElementById("scheduleModal").style.display = "none";
}

function bukaModalJadwal() {
  const savedPlay = localStorage.getItem("capsah_play_time");
  const savedPay = localStorage.getItem("capsah_pay_date");

  if (savedPlay) document.getElementById("modalPlayInput").value = savedPlay;
  if (savedPay) document.getElementById("modalPayInput").value = savedPay;

  document.getElementById("scheduleModal").style.display = "flex";
}

function tampilkanInfoJadwal(playVal, payVal) {
  document.getElementById("displayPlayDate").innerText = formatDateTimeIndo(playVal);
  document.getElementById("displayPayDate").innerText = formatDateIndo(payVal);
  document.getElementById("scheduleInfoBox").style.display = "flex";
}

function cekStatusJadwal() {
  const savedPlay = localStorage.getItem("capsah_play_time");
  const savedPay = localStorage.getItem("capsah_pay_date");

  if (savedPlay && savedPay) {
    document.getElementById("scheduleModal").style.display = "none";
    tampilkanInfoJadwal(savedPlay, savedPay);
  } else {
    // Set default ke waktu sekarang
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById("modalPlayInput").value = now.toISOString().slice(0, 16);
    document.getElementById("modalPayInput").value = new Date().toISOString().split('T')[0];
    document.getElementById("scheduleModal").style.display = "flex";
  }
}

// --- FUNGSI UTAMA SCOREBOARD ---
function buatTabel(id, start=[0,0,0,0], names=["P1","P2","P3","P4"], hasStart=false) {
  let div = document.createElement("div");
  div.className = "tableBox";

  let html = `
    <div class="table-header-flex">
      <h3>SET ${id+1}</h3>
      <button class="btn-share" onclick="bagikanKeWA(${id})">
        💬 Share ke WhatsApp
      </button>
    </div>
    <table id="table${id}">
  `;

  html += `<tr><th>Rnd</th>`;
  for (let i = 0; i < players; i++) {
    html += `<th><input value="${names[i]}" onchange="hitung(${id})"></th>`;
  }
  html += `</tr>`;

  if (hasStart) {
    html += `<tr><td>0</td>`;
    for (let i = 0; i < players; i++) {
      html += `<td><input value="${start[i]}" readonly style="background:#0f1720;color:#94a3b8;"></td>`;
    }
    html += `</tr>`;
  }

  for (let r = 1; r <= rounds; r++) {
    html += `<tr><td>${r}</td>`;
    for (let p = 0; p < players; p++) {
      html += `<td><input type="number" oninput="hitung(${id});saveGame()"></td>`;
    }
    html += `</tr>`;
  }

  html += `<tr><td><strong>Total</strong></td>`;
  for (let i = 0; i < players; i++) {
    html += `<td id="p${id}_${i}"><strong>0</strong></td>`;
  }
  html += `</tr>`;

  html += `<tr><td><strong>IDR</strong></td>`;
  for (let i = 0; i < players; i++) {
    html += `<td id="b${id}_${i}">Rp 0</td>`;
  }
  html += `</tr></table>`;

  div.innerHTML = html;
  document.getElementById("tables").appendChild(div);
}

// --- FUNGSI BAGIKAN KE WHATSAPP (LENGKAP DUA JADWAL) ---
function bagikanKeWA(id) {
  let table = document.getElementById("table" + id);
  let savedPlay = localStorage.getItem("capsah_play_time");
  let savedPay = localStorage.getItem("capsah_pay_date");
  
  let jadwalMainStr = formatDateTimeIndo(savedPlay);
  let jadwalBayarStr = formatDateIndo(savedPay);
  let mataVal = document.getElementById("mata").value;

  let dataPemain = [];
  for (let i = 0; i < players; i++) {
    let nama = table.rows[0].cells[i + 1].children[0].value || `P${i+1}`;
    let totalPoin = parseInt(document.getElementById(`p${id}_${i}`).innerText) || 0;
    let idrText = document.getElementById(`b${id}_${i}`).innerText;
    dataPemain.push({ nama, totalPoin, idrText });
  }

  dataPemain.sort((a, b) => b.totalPoin - a.totalPoin);

  let pesan = `🃏 *HASIL CAPSAH SCOREBOARD (SET ${id + 1})* 🃏\n`;
  pesan += `🎮 Jadwal Main: ${jadwalMainStr}\n`;
  pesan += `💸 Batas Bayar: *${jadwalBayarStr}*\n`;
  pesan += `💰 Nilai Mata: Rp ${parseInt(mataVal).toLocaleString("id-ID")}\n\n`;
  pesan += `*Klasemen Sementara:*\n`;

  let medali = ["🥇", "🥈", "🥉", "💀"];
  dataPemain.forEach((p, idx) => {
    pesan += `${medali[idx]} *${p.nama}* : ${p.totalPoin} poin (${p.idrText})\n`;
  });

  pesan += `\n_Dicatat otomatis via Capsah Scoreboard_ 🚀`;

  let urlWA = `https://api.whatsapp.com/send?text=${encodeURIComponent(pesan)}`;
  window.open(urlWA, '_blank');
}

function hitung(id) {
  let table = document.getElementById("table" + id);
  let total = [0, 0, 0, 0];

  for (let i = 1; i < table.rows.length - 2; i++) {
    for (let j = 1; j <= players; j++) {
      let val = table.rows[i].cells[j].children[0].value;
      if (val != "") total[j - 1] += parseInt(val);
    }
  }

  let mata = parseInt(document.getElementById("mata").value) || 0;

  for (let i = 0; i < players; i++) {
    document.getElementById(`p${id}_${i}`).innerHTML = `<strong>${total[i]}</strong>`;

    let bayar = 0;
    for (let j = 0; j < players; j++) {
      if (i != j) {
        bayar += (total[j] - total[i]);
      }
    }

    bayar *= mata;

    let cell = document.getElementById(`b${id}_${i}`);
    cell.innerText = "Rp " + bayar.toLocaleString("id-ID");
    cell.className = bayar < 0 ? "minus" : "plus";
  }

  saveGame();
}

function updateSemuaHitung() {
  let tables = document.querySelectorAll("table");
  tables.forEach((_, idx) => hitung(idx));
}

function kick() {
  let tables = document.querySelectorAll("table");
  let last = tables[tables.length - 1];

  let totals = [];
  let names = [];

  for (let i = 0; i < players; i++) {
    totals.push(parseInt(last.querySelector(`#p${tables.length - 1}_${i}`).innerText));
    names.push(last.rows[0].cells[i + 1].children[0].value);
  }

  buatTabel(tables.length, totals, names, true);
  hitung(tables.length);
  saveGame();
}

function saveGame() {
  let tables = document.querySelectorAll("table");
  let gameData = {
    mata: document.getElementById("mata").value,
    sets: []
  };

  tables.forEach((table) => {
    let set = {
      names: [],
      start: [],
      scores: []
    };
    let hasStart = table.rows[1] && table.rows[1].cells[0].innerText === "0" && table.rows[1].cells[1].children[0].readOnly;

    for (let i = 1; i <= players; i++) {
      set.names.push(table.rows[0].cells[i].children[0].value);
    }

    if (hasStart) {
      for (let i = 1; i <= players; i++) {
        set.start.push(table.rows[1].cells[i].children[0].value);
      }
    } else {
      set.start = [0, 0, 0, 0];
    }

    for (let round = 1; round <= rounds; round++) {
      let roundScores = [];
      for (let p = 1; p <= players; p++) {
        let rowIndex = round + (hasStart ? 1 : 0);
        let val = table.rows[rowIndex].cells[p].children[0].value;
        roundScores.push(val);
      }
      set.scores.push(roundScores);
    }
    gameData.sets.push(set);
  });

  localStorage.setItem("capsah", JSON.stringify(gameData));
}

function loadGame() {
  cekStatusJadwal();

  let savedData = localStorage.getItem("capsah");
  if (!savedData) {
    buatTabel(0);
    return;
  }

  let gameData = JSON.parse(savedData);
  document.getElementById("mata").value = gameData.mata;

  gameData.sets.forEach((set, idx) => {
    let hasStart = idx > 0;
    let start = hasStart ? set.start : [0, 0, 0, 0];
    buatTabel(idx, start, set.names, hasStart);

    let table = document.getElementById("table" + idx);
    set.scores.forEach((roundScores, roundIdx) => {
      let rowIndex = roundIdx + 1 + (hasStart ? 1 : 0);
      for (let p = 0; p < players; p++) {
        table.rows[rowIndex].cells[p + 1].children[0].value = roundScores[p];
      }
    });

    hitung(idx);
  });
}

function resetGame() {
  if (confirm("Yakin mau reset semua data skor & jadwal?")) {
    localStorage.removeItem("capsah");
    localStorage.removeItem("capsah_play_time");
    localStorage.removeItem("capsah_pay_date");
    location.reload();
  }
}

loadGame();
</script>
